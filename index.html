<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lyanna's Robot Parts Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one big centered card, one question at a time, huge tap targets for 6-year-olds.
   A single bright look on purpose (sky blue + Qbit yellow from the kit), so colors are explicit in both themes. */
:root{
  --sky:#8fc4f0; --sky-deep:#3f8fd6; --ink:#1d2b3a; --paper:#fffdf5;
  --qyellow:#ffcf2e; --qyellow-deep:#e0a800; --brick:#e5483d; --good:#2fa862; --good-bg:#d9f6e4; --bad-bg:#ffe1de;
  --grey:#5b6773; --line:#c9dff3;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Comic Sans MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--sky); color:var(--ink); font-family:var(--body); font-size:20px;
  padding-inline:16px; padding-block:20px;
  background-image:radial-gradient(circle at 20px 20px,#ffffff44 3px,transparent 4px);
  background-size:56px 56px; min-height:100vh;
}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,.btn,.chip{font-family:var(--display)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--ink);background:var(--qyellow);padding:6px 14px;border-radius:12px;box-shadow:0 4px 0 var(--qyellow-deep)}
.stars{font-family:var(--display);font-weight:600;background:var(--paper);padding:6px 14px;border-radius:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--paper);border-radius:28px;padding:22px;box-shadow:0 8px 0 var(--sky-deep);display:flex;flex-direction:column;gap:18px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--brick);outline-offset:3px}

/* home */
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero svg{width:110px;flex:none}
.hero h1{margin:0;font-size:2.1rem;line-height:1.05;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--grey)}
.topics{display:grid;gap:12px}
.topic{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:20px;border:3px solid var(--line);background:#fff;transition:transform .12s}
.topic:hover{transform:translateY(-2px);border-color:var(--sky-deep)}
.topic .big{font-size:2.4rem;flex:none;width:58px;text-align:center}
.topic b{font-family:var(--display);font-size:1.3rem;display:block}
.topic span.sub{color:var(--grey);font-size:.85rem}
.topic .best{margin-left:auto;font-size:.95rem;white-space:nowrap}
.topic.mix{background:var(--qyellow);border-color:var(--qyellow-deep)}
.topic.mix span.sub{color:#5b4600}

/* quiz */
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);color:var(--grey);gap:8px}
.chip{background:#fff;border:2px solid var(--line);padding:4px 12px;border-radius:99px;font-size:.9rem}
.qrow{display:flex;gap:14px;align-items:center}
.qrow svg{width:84px;flex:none}
.q{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1.2;margin:0;text-wrap:balance;min-width:0}
.speak{flex:none;width:54px;height:54px;border-radius:50%;background:var(--sky);font-size:1.5rem;box-shadow:0 4px 0 var(--sky-deep)}
.speak:active{transform:translateY(3px);box-shadow:none}
.visual{font-size:4.2rem;text-align:center;line-height:1.1;background:#eaf5ff;border-radius:20px;padding:12px}
.visual.photo{background:#fff;border:3px solid var(--line);padding:8px}.visual img{display:block;margin:0 auto;max-height:230px;max-width:100%;width:auto;border-radius:14px}
.opt .em img{width:84px;height:72px;object-fit:contain;display:block;border-radius:8px}.opt .em:has(img){width:88px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:76px;border-radius:20px;border:4px solid var(--line);background:#fff;text-align:left;font-family:var(--display);font-weight:600;font-size:1.35rem;transition:transform .1s}
.opt:hover:not([disabled]){transform:translateY(-2px);border-color:var(--sky-deep)}
.opt .em{font-size:2.3rem;flex:none;width:56px;text-align:center;line-height:1}
.opt .em svg{width:52px;height:52px;display:block;margin:auto}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--brick);animation:shake .35s;opacity:.7}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:3.2em;font-family:var(--display);font-size:1.2rem;font-weight:600;display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 14px}
.fb.good{background:var(--good-bg);color:#126b38}
.fb.bad{background:var(--bad-bg);color:#a3221a}
.fb .why{font-family:var(--body);font-weight:400;font-size:.95rem;color:var(--ink)}
.btn{background:var(--brick);color:#fff;font-weight:700;font-size:1.4rem;padding:14px 26px;border-radius:18px;box-shadow:0 6px 0 #a8281f;align-self:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a8281f}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line);border:3px solid var(--line)}
.btn[hidden]{display:none}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.link{font-family:var(--display);color:var(--grey);text-decoration:underline;align-self:flex-start;font-size:1rem}

/* result */
.result{text-align:center;align-items:center}
.result h2{margin:0;font-size:2rem}
.big-stars{font-size:3rem;letter-spacing:6px}
.result svg{width:150px}

.conf{position:fixed;top:-20px;width:12px;height:16px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.bob{animation:bob 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.bob,.opt.wrong,.conf{animation:none}.bar i{transition:none}}
@media (max-width:420px){.visual{font-size:3.4rem}.q{font-size:1.35rem}.qrow svg{width:64px}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">🤖 Robot Parts Quiz</div>
    <div class="stars" aria-live="polite">⭐ <span id="total">0</span></div>
  </div>
  <main id="app" class="card"></main>
</div>

   + eyes
   +'<path d="'+mouth+'" fill="'+(mood==='cheer'?'#e5483d':'none')+'" stroke="#1d2b3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
   +'<rect x="30" y="84" width="40" height="18" rx="6" fill="#8fc4f0" stroke="#1d2b3a" stroke-width="4"/></svg>';
}

/* ---------- helpers ---------- */
var app=document.getElementById('app'), totalEl=document.getElementById('total');
var ctx=null, run=null, bestKey='lyannaPartsBest';
function store(get,k,v){try{if(get)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var best=store(true,bestKey)||{}, total=(store(true,'lyannaPartsTotal')||0);
totalEl.textContent=total;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function beep(f,d,type,delay){
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);var t=ctx.currentTime+(delay||0);
    g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}
}
function sayYes(){beep(660,.12,'triangle');beep(880,.18,'triangle',.12)}
function sayNo(){beep(220,.25,'sawtooth')}
function speak(text){
  try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var cols=['#ffcf2e','#e5483d','#3f8fd6','#2fa862','#fff'];
  for(var i=0;i<40;i++){var d=document.createElement('i');d.className='conf';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[i%5];d.style.animationDuration=(1.8+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.5+'s';
    document.body.appendChild(d);setTimeout(function(n){n.remove()},4200,d)}
}
function stars(n,of){var s='';for(var i=0;i<of;i++)s+=i<n?'⭐':'☆';return s}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* ---------- screens ---------- */
function home(){
  try{speechSynthesis.cancel()}catch(e){}
  var b=best.all;
  app.className='card';
  app.innerHTML='<div class="hero">'+bolt('happy')+'<div><h1>Lyanna\'s Robot Parts Quiz</h1><p>Hi! I am Bolt. Can you name the parts of our robot car?</p></div></div>'
   +'<button class="topic mix" id="go"><span class="big">🚗</span><span><b>Start the quiz</b><span class="sub">'+Q.length+' questions</span></span>'+(b!=null?'<span class="best" title="Best score">'+stars(b,3)+'</span>':'')+'</button>';
  document.getElementById('go').onclick=function(){start('all')};
}

function start(t){
  var pool = Q.slice();
  run={topic:'all',list:pool,i:0,first:0};
  beep(520,.1,'triangle');
  question();
}

function question(){
  var it=run.list[run.i], tries=0, done=false;
  var order=shuffle(it.o.map(function(o,i){return i}));
  var h='<div class="meta"><button class="link" id="quit">← Home</button><span class="chip">Question '+(run.i+1)+' of '+run.list.length+'</span></div>'
   +'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+run.list.length+'" aria-valuenow="'+run.i+'"><i style="width:'+(run.i/run.list.length*100)+'%"></i></div>'
   +'<div class="qrow">'+bolt('happy').replace('class=""','')+'<h2 class="q">'+esc(it.q)+'</h2><button class="speak" id="spk" aria-label="Read the question out loud">🔊</button></div>'
   +'<div class="visual'+(it.img?' photo':'')+'">'+(it.img||it.v)+'</div><div class="opts">';
  order.forEach(function(oi){
    var o=it.o[oi];
    h+='<button class="opt" data-i="'+oi+'"><span class="em">'+o[0]+'</span><span>'+esc(o[1])+'</span></button>';
  });
  h+='</div><div class="fb" id="fb" aria-live="polite"></div><button class="btn" id="next" hidden>'+(run.i+1===run.list.length?'See my stars ⭐':'Next →')+'</button>';
  app.innerHTML=h;
  var fb=document.getElementById('fb'), next=document.getElementById('next');
  document.getElementById('quit').onclick=home;
  document.getElementById('spk').onclick=function(){speak(it.q+' '+it.o.map(function(o){return o[1]}).join(', or ')+'?')};
  app.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      if(done)return;
      var i=+b.dataset.i;
      if(i===it.a){
        done=true; b.classList.add('right');
        app.querySelectorAll('.opt').forEach(function(x){x.disabled=true});
        if(tries===0)run.first++;
        sayYes();
        fb.className='fb good';fb.innerHTML='<span>🎉 Yes! <span class="why">'+esc(it.why)+'</span></span>';
        if(tries===0){total++;totalEl.textContent=total;store(false,'lyannaPartsTotal',total)}
        next.hidden=false; next.focus();
      }else{
        tries++; b.classList.add('wrong'); b.disabled=true; sayNo();
        fb.className='fb bad';fb.textContent='Oops! Try another one 💪';
      }
    };
  });
  next.onclick=function(){run.i++; run.i<run.list.length?question():finish()};
  setTimeout(function(){speak(it.q)},250);
}

function finish(){
  var n=run.list.length, s=run.first/n, st = s>=.9?3 : s>=.6?2 : 1;
  if(best[run.topic]==null||st>best[run.topic]){best[run.topic]=st;store(false,bestKey,best)}
  var msg = st===3?'Super robot builder!':st===2?'Great job!':'Good try! Play again to get more stars.';
  app.className='card result';
  app.innerHTML=bolt('cheer')+'<h2>'+msg+'</h2><div class="big-stars" aria-label="'+st+' out of 3 stars">'+stars(st,3)+'</div>'
   +'<p>You got <b>'+run.first+'</b> of <b>'+n+'</b> right on the first try.</p>'
   +'<div class="row"><button class="btn" id="again">Play again 🔁</button><button class="btn alt" id="hm">More games</button></div>';
  app.className='card result';
  sayYes();beep(1040,.25,'triangle',.3);confetti();speak(msg);
  document.getElementById('again').onclick=function(){app.className='card';start(run.topic)};
  document.getElementById('hm').onclick=function(){app.className='card';home()};
}
home();
</script>

</body></html>
